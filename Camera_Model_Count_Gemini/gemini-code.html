<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo EXIF & Camera Model Analyzer</title>
    <!-- Lightweight EXIF parser for modern browsers -->
    <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
    <style>
        :root {
            --bg-deep: #0a0a0c;
            --bg-surface: #16161a;
            --bg-card: #202026;
            --accent: #007aff;
            --success: #34c759;
            --warning: #ff9500;
            --danger: #ff3b30;
            --text: #f5f5f7;
            --text-muted: #86868b;
            --border: #2c2c35;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-deep); color: var(--text);
            min-height: 100vh; display: flex; flex-direction: column;
        }
        header {
            background: var(--bg-surface); padding: 14px 20px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center; z-index: 10;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .title h1 { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; }
        .version-tag {
            font-size: 11px; font-weight: 600; color: var(--accent);
            background: rgba(0, 122, 255, 0.1); border: 1px solid var(--accent);
            padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 4px;
        }
        .title span.subtitle { font-size: 11px; color: var(--text-muted); display: block; margin-top: 3px; }
        .stats { display: flex; gap: 12px; }
        .stat-card {
            background: var(--bg-card); padding: 6px 12px; border-radius: 8px;
            border: 1px solid var(--border); font-size: 13px; font-weight: 500;
        }
        .stat-card span { font-weight: 700; margin-left: 4px; }
        
        #filter-bar {
            background: var(--bg-surface); padding: 12px 20px; border-bottom: 1px solid var(--border);
            display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
        }
        .filter-group { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); }
        .filter-group label { font-weight: 600; color: var(--text); }
        input[type="date"], select {
            background: var(--bg-card); border: 1px solid var(--border); color: var(--text);
            padding: 6px 10px; border-radius: 6px; font-size: 13px; outline: none;
        }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); }

        #main-container {
            flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px;
        }

        #drop-zone {
            border: 2px dashed var(--border); border-radius: 12px; padding: 26px; text-align: center;
            background: var(--bg-surface); transition: all 0.2s ease;
        }
        #drop-zone.dragover { border-color: var(--accent); background: var(--bg-card); }
        
        .picker-btn {
            background: var(--accent); color: #fff; font-weight: 600; padding: 10px 18px;
            border-radius: 8px; border: none; font-size: 13px; cursor: pointer; transition: opacity 0.2s;
        }
        .picker-btn:hover { opacity: 0.85; }

        /* Summary Cards & Collapsibles */
        .summary-card {
            background: var(--bg-surface); border: 1px solid var(--border); border-radius: 10px;
            padding: 16px; margin-bottom: 16px;
        }
        
        details.summary-card { padding: 0; overflow: hidden; }
        details.summary-card summary {
            padding: 16px; cursor: pointer; user-select: none; list-style: none;
            display: flex; justify-content: space-between; align-items: center;
        }
        details.summary-card summary::-webkit-details-marker { display: none; }
        details.summary-card summary .header-title-wrap::before {
            content: "►"; display: inline-block; margin-right: 8px; font-size: 11px;
            color: var(--accent); transition: transform 0.2s ease;
        }
        details[open].summary-card summary .header-title-wrap::before {
            transform: rotate(90deg);
        }
        .details-body { padding: 0 16px 16px 16px; border-top: 1px solid var(--border); }

        .summary-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 12px;
        }
        .summary-header h2 { font-size: 16px; color: var(--accent); display: inline-block; }
        .summary-badge {
            background: var(--bg-card); border: 1px solid var(--border);
            padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600;
        }

        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
        th { background: var(--bg-card); color: var(--text-muted); padding: 8px 12px; font-weight: 600; }
        td { padding: 8px 12px; border-top: 1px solid var(--border); color: var(--text); }
        tfoot td { background: var(--bg-card); font-weight: 700; border-top: 2px solid var(--accent); }
        tr:hover { background: rgba(255,255,255,0.02); }

        .section-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin: 16px 0 8px 4px;
        }
        .section-bar h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted); }

        #logger {
            height: 100px; background: #050507; border-top: 1px solid var(--border);
            font-family: monospace; font-size: 11px; padding: 10px 16px;
            overflow-y: scroll; color: #a1a1aa;
        }
        .log-line { margin-bottom: 4px; line-height: 1.5; }
    </style>
</head>
<body>
    <header>
        <div class="title">
            <h1>CAMERA MODEL METADATA ANALYZER</h1>
            <div>
                <span class="version-tag">v1.3.2</span>
                <span style="font-size:11px; color:var(--text-muted); margin-left:6px;">Build: 05-Aug-2026 12:35 PM AEST (Sydney)</span>
            </div>
            <span class="subtitle">EXIF Extraction, Video/Edited Photo Handling, Grand Totals & Collapsible Listings</span>
        </div>
        <div class="stats">
            <div class="stat-card">Parsed: <span id="s-total" style="color:var(--accent)">0</span></div>
            <div class="stat-card">Filtered: <span id="s-filtered" style="color:var(--success)">0</span></div>
            <div class="stat-card">Errors / Unread: <span id="s-failed" style="color:var(--danger)">0</span></div>
        </div>
    </header>

    <div id="filter-bar">
        <div class="filter-group">
            <label for="start-date">Start Date:</label>
            <input type="date" id="start-date" onchange="applyFilters()">
        </div>
        <div class="filter-group">
            <label for="end-date">End Date:</label>
            <input type="date" id="end-date" onchange="applyFilters()">
        </div>
        <div class="filter-group">
            <label for="sort-by">Sort Models By:</label>
            <select id="sort-by" onchange="applyFilters()">
                <option value="model-asc">Camera Model (A-Z)</option>
                <option value="count-desc">Photo Count (High to Low)</option>
                <option value="count-asc">Photo Count (Low to High)</option>
            </select>
        </div>
        <button class="action-btn" style="margin-left:auto; background:var(--bg-card); border:1px solid var(--border); color:var(--text); padding:6px 12px; border-radius:6px; cursor:pointer;" onclick="clearFilters()">Reset Filters</button>
    </div>

    <div id="main-container">
        <div id="drop-zone">
            <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 12px;">
                Drag & Drop media files or whole folders here, or use a selection button:
            </p>
            <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
                <button class="picker-btn" onclick="document.getElementById('f-in-files').click()">Select Files</button>
                <button class="picker-btn" style="background: var(--bg-card); border: 1px solid var(--border); color: var(--text);" onclick="document.getElementById('f-in-folder').click()">Select Folder</button>
            </div>
            <!-- Individual/Multiple File Input -->
            <input type="file" id="f-in-files" accept="image/*,video/*,.heic,.heif,.mov,.mp4" multiple style="display:none">
            <!-- Directory/Folder Input (without accept attribute to avoid Explorer conflicts) -->
            <input type="file" id="f-in-folder" webkitdirectory directory multiple style="display:none">
        </div>

        <div id="output-container"></div>
    </div>

    <div id="logger"></div>

    <script>
        let rawPhotoData = [];
        let allDetailsOpen = true;

        const dropZone = document.getElementById('drop-zone');
        const fileInputFiles = document.getElementById('f-in-files');
        const fileInputFolder = document.getElementById('f-in-folder');

        fileInputFiles.addEventListener('change', (e) => processFiles(Array.from(e.target.files)));
        fileInputFolder.addEventListener('change', (e) => processFiles(Array.from(e.target.files)));

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
            dropZone.addEventListener(evt, (e) => { e.preventDefault(); e.stopPropagation(); });
        });
        ['dragenter', 'dragover'].forEach(() => dropZone.classList.add('dragover'));
        ['dragleave', 'drop'].forEach(() => dropZone.classList.remove('dragover'));
        
        dropZone.addEventListener('drop', async (e) => {
            const items = Array.from(e.dataTransfer.items);
            log(`Scanning dropped items...`, '#007aff');
            
            const fileEntries = [];
            for (const item of items) {
                if (item.webkitGetAsEntry) {
                    const entry = item.webkitGetAsEntry();
                    if (entry) await scanEntry(entry, fileEntries);
                } else if (item.kind === 'file') {
                    fileEntries.push(item.getAsFile());
                }
            }
            processFiles(fileEntries);
        });

        async function scanEntry(entry, fileList) {
            if (entry.isFile) {
                return new Promise((resolve) => {
                    entry.file((file) => {
                        if (file.type.startsWith('image/') || file.type.startsWith('video/') || file.name.match(/\.(heic|heif|jpg|jpeg|png|mov|mp4|m4v)$/i)) {
                            fileList.push(file);
                        }
                        resolve();
                    });
                });
            } else if (entry.isDirectory) {
                const dirReader = entry.createReader();
                const entries = await new Promise((resolve) => dirReader.readEntries(resolve));
                for (const childEntry of entries) {
                    await scanEntry(childEntry, fileList);
                }
            }
        }

        function log(m, color = '') {
            const p = document.getElementById('logger');
            p.innerHTML += `<div class="log-line" style="color:${color}">[${new Date().toLocaleTimeString()}] ${m}</div>`;
            p.scrollTop = p.scrollHeight;
        }

        async function processFiles(files) {
            if (!files.length) return;
            log(`Starting extraction for ${files.length} item(s)...`, '#007aff');
            rawPhotoData = [];
            let unreadCount = 0;

            let count = 0;
            for (const file of files) {
                count++;
                let model = 'Unknown Camera';
                let captureDate = file.lastModified ? new Date(file.lastModified) : new Date();
                let width = 0, height = 0;
                let isUnparseable = false;

                const lowerName = file.name.toLowerCase();
                const isVideo = file.type.startsWith('video/') || lowerName.endsWith('.mp4') || lowerName.endsWith('.mov') || lowerName.endsWith('.m4v');

                // 1. Explicit Screen Recording Detection
                if (lowerName.includes('screenrecording') || lowerName.includes('screen recording') || lowerName.includes('screen_recording')) {
                    model = 'Screen Recording';
                }
                // 2. Explicit Screenshot Filename Detection
                else if (lowerName.includes('screenshot') || lowerName.includes('screen shot') || lowerName.includes('screen_shot')) {
                    model = 'Screenshot';
                }
                // 3. Videos (Skip EXIF parsing to prevent JS exceptions)
                else if (isVideo) {
                    model = 'Video File';
                }
                // 4. Photos EXIF Extraction
                else {
                    try {
                        const exif = await exifr.parse(file, ['Make', 'Model', 'DateTimeOriginal', 'ExifImageWidth', 'ExifImageHeight']);
                        if (exif) {
                            if (exif.Model) {
                                model = exif.Make && !exif.Model.startsWith(exif.Make) 
                                    ? `${exif.Make} ${exif.Model}` 
                                    : exif.Model;
                            }
                            if (exif.DateTimeOriginal) {
                                captureDate = new Date(exif.DateTimeOriginal);
                            }
                            width = exif.ExifImageWidth || 0;
                            height = exif.ExifImageHeight || 0;
                        }
                    } catch (err) {
                        log(`Notice: EXIF absent or unreadable for ${file.name}`, '#ff9500');
                    }

                    // Fallback heuristics for photos missing camera EXIF
                    if (model === 'Unknown Camera') {
                        if (lowerName.includes('(edited)')) {
                            model = 'Edited Photo (Stripped EXIF)';
                        } else if (file.type === 'image/png' || lowerName.endsWith('.png')) {
                            model = 'Screenshot';
                        }
                    }
                }

                // Retrieve media dimensions if absent from EXIF
                if (!width || !height) {
                    const dims = await getMediaDimensions(file);
                    width = dims.width;
                    height = dims.height;
                }

                // Mark unparseable only if dimensions are missing AND no model could be assigned
                if (width === 0 && height === 0 && model === 'Unknown Camera') {
                    model = 'Unparseable / Read Error';
                    isUnparseable = true;
                    unreadCount++;
                }

                const aspectRatio = height > 0 ? (width / height).toFixed(3) : 'N/A';

                rawPhotoData.push({
                    name: file.name,
                    size: file.size,
                    model: model.trim(),
                    date: captureDate,
                    width: width,
                    height: height,
                    aspectRatio: aspectRatio,
                    isUnparseable: isUnparseable
                });

                if (count % 10 === 0 || count === files.length) {
                    log(`Processed ${count}/${files.length} items...`);
                }
            }

            log(`Parsing complete! Total: ${rawPhotoData.length} items processed (${unreadCount} unparseable).`, '#34c759');
            document.getElementById('s-total').innerText = rawPhotoData.length;
            document.getElementById('s-failed').innerText = unreadCount;
            applyFilters();
        }

        function getMediaDimensions(file) {
            return new Promise((resolve) => {
                if (file.type.startsWith('video/') || file.name.match(/\.(mp4|mov|m4v|webm)$/i)) {
                    const video = document.createElement('video');
                    const url = URL.createObjectURL(file);
                    video.onloadedmetadata = () => {
                        URL.revokeObjectURL(url);
                        resolve({ width: video.videoWidth, height: video.videoHeight });
                    };
                    video.onerror = () => {
                        URL.revokeObjectURL(url);
                        resolve({ width: 0, height: 0 });
                    };
                    video.src = url;
                } else {
                    const img = new Image();
                    const url = URL.createObjectURL(file);
                    img.onload = () => {
                        URL.revokeObjectURL(url);
                        resolve({ width: img.naturalWidth, height: img.naturalHeight });
                    };
                    img.onerror = () => {
                        URL.revokeObjectURL(url);
                        resolve({ width: 0, height: 0 });
                    };
                    img.src = url;
                }
            });
        }

        function applyFilters() {
            if (!rawPhotoData.length) return;

            const startDateVal = document.getElementById('start-date').value;
            const endDateVal = document.getElementById('end-date').value;
            const sortBy = document.getElementById('sort-by').value;

            const startDate = startDateVal ? new Date(startDateVal + 'T00:00:00') : null;
            const endDate = endDateVal ? new Date(endDateVal + 'T23:59:59') : null;

            // 1. Filter by Date Range
            const filtered = rawPhotoData.filter(item => {
                if (startDate && item.date < startDate) return false;
                if (endDate && item.date > endDate) return false;
                return true;
            });

            document.getElementById('s-filtered').innerText = filtered.length;

            // 2. Group by Category / Camera Model
            const grouped = {};
            filtered.forEach(item => {
                if (!grouped[item.model]) {
                    grouped[item.model] = [];
                }
                grouped[item.model].push(item);
            });

            // 3. Sort Models / Categories
            let sortedModels = Object.keys(grouped);

            if (sortBy === 'model-asc') {
                sortedModels.sort((a, b) => a.localeCompare(b));
            } else if (sortBy === 'count-desc') {
                sortedModels.sort((a, b) => grouped[b].length - grouped[a].length);
            } else if (sortBy === 'count-asc') {
                sortedModels.sort((a, b) => grouped[a].length - grouped[b].length);
            }

            renderOutput(grouped, sortedModels, filtered);
        }

        function renderOutput(groupedData, sortedModelKeys, filteredItems) {
            const container = document.getElementById('output-container');
            container.innerHTML = '';

            const totalFilteredCount = filteredItems.length;

            if (sortedModelKeys.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--text-muted);">No items match the selected filter criteria.</div>`;
                return;
            }

            // Calculate overall date range for Grand Total
            const allTimestamps = filteredItems.map(p => p.date.getTime()).filter(t => !isNaN(t));
            const overallMinDate = allTimestamps.length ? new Date(Math.min(...allTimestamps)).toLocaleDateString() : 'N/A';
            const overallMaxDate = allTimestamps.length ? new Date(Math.max(...allTimestamps)).toLocaleDateString() : 'N/A';
            const overallDateRangeStr = overallMinDate === overallMaxDate ? overallMinDate : `${overallMinDate} - ${overallMaxDate}`;

            // ── 1. SUMMARY OVERVIEW TABLE WITH GRAND TOTAL ───────────────────
            const summaryCard = document.createElement('div');
            summaryCard.className = 'summary-card';
            summaryCard.style.borderLeft = '4px solid var(--accent)';

            let summaryRowsHtml = '';
            sortedModelKeys.forEach(modelKey => {
                const items = groupedData[modelKey];
                const count = items.length;
                const sharePct = totalFilteredCount > 0 ? ((count / totalFilteredCount) * 100).toFixed(1) : 0;

                const timestamps = items.map(p => p.date.getTime()).filter(t => !isNaN(t));
                const minDate = timestamps.length ? new Date(Math.min(...timestamps)).toLocaleDateString() : 'N/A';
                const maxDate = timestamps.length ? new Date(Math.max(...timestamps)).toLocaleDateString() : 'N/A';
                const dateRangeStr = minDate === maxDate ? minDate : `${minDate} - ${maxDate}`;

                let labelStyle = 'font-weight:600; color:var(--text);';
                if (modelKey.includes('Screenshot') || modelKey.includes('Screen Recording') || modelKey.includes('Edited Photo')) {
                    labelStyle = 'font-weight:600; color:var(--warning);';
                } else if (modelKey === 'Unparseable / Read Error') {
                    labelStyle = 'font-weight:600; color:var(--danger);';
                }

                summaryRowsHtml += `
                    <tr>
                        <td style="${labelStyle}">${modelKey}</td>
                        <td style="color:var(--accent); font-weight:700;">${count}</td>
                        <td>${sharePct}%</td>
                        <td>${dateRangeStr}</td>
                    </tr>
                `;
            });

            summaryCard.innerHTML = `
                <div class="summary-header">
                    <h2>Camera Model & Category Overview</h2>
                    <div class="summary-badge" style="color: var(--accent); border-color: var(--accent);">${sortedModelKeys.length} Group(s) Total</div>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Camera Model / Category</th>
                            <th>Count</th>
                            <th>Share of Batch</th>
                            <th>Date Range</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${summaryRowsHtml}
                    </tbody>
                    <tfoot>
                        <tr>
                            <td>GRAND TOTAL</td>
                            <td style="color:var(--accent);">${totalFilteredCount}</td>
                            <td>100%</td>
                            <td>${overallDateRangeStr}</td>
                        </tr>
                    </tfoot>
                </table>
            `;
            container.appendChild(summaryCard);

            // ── 2. SECTION BAR WITH TOGGLE ALL BUTTON ────────────────────────
            const sectionBar = document.createElement('div');
            sectionBar.className = 'section-bar';
            sectionBar.innerHTML = `
                <h3>Detailed Items by Category / Camera Model</h3>
                <button class="action-btn" style="background:var(--bg-card); border:1px solid var(--border); color:var(--text); padding:4px 10px; border-radius:6px; font-size:12px; cursor:pointer;" onclick="toggleAllDetails()">
                    ${allDetailsOpen ? 'Collapse All' : 'Expand All'}
                </button>
            `;
            container.appendChild(sectionBar);

            // ── 3. COLLAPSIBLE LISTING CARDS PER GROUP ───────────────────────
            sortedModelKeys.forEach(modelKey => {
                const items = groupedData[modelKey];
                
                const timestamps = items.map(p => p.date.getTime()).filter(t => !isNaN(t));
                const minDate = timestamps.length ? new Date(Math.min(...timestamps)).toLocaleDateString() : 'N/A';
                const maxDate = timestamps.length ? new Date(Math.max(...timestamps)).toLocaleDateString() : 'N/A';
                const dateRangeStr = minDate === maxDate ? minDate : `${minDate} - ${maxDate}`;

                const details = document.createElement('details');
                details.className = 'summary-card detail-toggle-card';
                if (allDetailsOpen) details.setAttribute('open', '');

                let rowsHtml = items.map(p => `
                    <tr>
                        <td>${p.name}</td>
                        <td>${p.date.toLocaleString()}</td>
                        <td>${p.width ? `${p.width} x ${p.height}` : 'N/A'}</td>
                        <td>${p.aspectRatio || 'N/A'}</td>
                    </tr>
                `).join('');

                let headerColor = '';
                if (modelKey.includes('Screenshot') || modelKey.includes('Screen Recording') || modelKey.includes('Edited Photo')) headerColor = 'color: var(--warning);';
                if (modelKey === 'Unparseable / Read Error') headerColor = 'color: var(--danger);';

                details.innerHTML = `
                    <summary>
                        <div class="header-title-wrap">
                            <h2 style="${headerColor}">${modelKey}</h2>
                            <span style="font-size:12px; color:var(--text-muted); margin-left:8px;">Date Range: ${dateRangeStr}</span>
                        </div>
                        <div class="summary-badge">${items.length} Item(s)</div>
                    </summary>
                    <div class="details-body">
                        <table>
                            <thead>
                                <tr>
                                    <th>File Name</th>
                                    <th>Date</th>
                                    <th>Dimensions (WxH)</th>
                                    <th>Aspect Ratio</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rowsHtml}
                            </tbody>
                        </table>
                    </div>
                `;
                container.appendChild(details);
            });
        }

        function toggleAllDetails() {
            allDetailsOpen = !allDetailsOpen;
            document.querySelectorAll('.detail-toggle-card').forEach(card => {
                if (allDetailsOpen) card.setAttribute('open', '');
                else card.removeAttribute('open');
            });
            applyFilters();
        }

        function clearFilters() {
            document.getElementById('start-date').value = '';
            document.getElementById('end-date').value = '';
            document.getElementById('sort-by').value = 'model-asc';
            applyFilters();
            log("Filters reset.", '#ff9500');
        }
    </script>
</body>
</html>
